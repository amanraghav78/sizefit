<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />

    <title>SizeFit — resize a photo to an exact file size</title>
    <meta name="description" content="Compress a photo to the exact KB size an online form demands — 20KB, 50KB, under 100KB — without ever going over the limit. Runs entirely in your browser. Nothing is uploaded." />
    <meta name="theme-color" content="#A32E1C" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="SizeFit — resize a photo to an exact file size" />
    <meta property="og:description" content="Hit the exact file size a form demands, without going one byte over. Works in your browser; nothing is uploaded." />
    <meta property="og:image" content="/icon.png" />
    <meta name="twitter:card" content="summary" />

    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Shown only until the JS bundle boots; the app paints over it. */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #A32E1C;
        color: #ffffff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-weight: 700;
        letter-spacing: 0.08em;
        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <noscript>
      SizeFit needs JavaScript. All the image work happens in your browser, which is why nothing
      you compress is ever uploaded.
    </noscript>
    <div id="root"></div>
    <div id="boot">SIZEFIT</div>
    <script>
      // Remove the boot splash once React has painted.
      window.addEventListener('load', function () {
        var boot = document.getElementById('boot');
        if (boot) {
          boot.style.transition = 'opacity 200ms';
          boot.style.opacity = '0';
          setTimeout(function () {
            boot.remove();
          }, 220);
        }
      });

      // Offline support. Registered here rather than in the app bundle so the
      // worker never ships to the native builds.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {
            // Offline support is a bonus; failing to register must not break
            // the page (it will not register at all over plain http).
          });
        });
      }
    </script>
  </body>
</html>
